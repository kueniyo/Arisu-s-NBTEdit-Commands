plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base {
    archivesName = 'arisus-nbted-commands-neoforge-26.3'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    // ModDevGradle 2.x requires mod/source-set bindings inside neoForge {}.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
